    const STORAGE_KEY = "accaQuizResults";
    const MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000; // 30 days
    let currentQuizId = Object.keys(quizLibrary)[0];
    let hasSubmitted = false;
    let historyCache = [];

    function getCurrentQuiz() {
        return quizLibrary[currentQuizId];
    }

    function populateMockSelector() {
        const selector = document.getElementById('mock-selector');
        selector.innerHTML = '';
        Object.entries(quizLibrary).forEach(([id, quiz]) => {
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = quiz.title;
            selector.appendChild(opt);
        });
        selector.value = currentQuizId;
    }

    function buildQuiz() {
        const quizContainer = document.getElementById('quiz-area');
        let html = '';
        let currentSection = '';
        const questions = getCurrentQuiz().questions;

        questions.forEach((q, index) => {
            if (q.section && q.section !== currentSection) {
                html += `<div class="section-header">${q.section}</div>`;
                currentSection = q.section;
            }

            html += `<div class="question-card" id="card-${index}">
                <div class="question-title">${q.question}</div>
                <div class="options">`;
            
            q.options.forEach((opt, i) => {
                let inputType = q.type; 
                html += `<label>
                    <input type="${inputType}" name="q${index}" value="${i}">
                    <span>${opt}</span>
                </label>`;
            });

            html += `</div>
                <div class="feedback" id="feedback-${index}"></div>
                <button class="show-answer-btn" id="show-answer-${index}" onclick="toggleAnswer(${index})" disabled>Show Answer</button>
            </div>`;
        });

        quizContainer.innerHTML = html;
        hasSubmitted = false;
        document.getElementById('result-display').style.display = 'none';
        document.getElementById('result-display').innerHTML = '';
    }

    function calculateScore() {
        const questions = getCurrentQuiz().questions;
        let score = 0;
        const attempt = {
            quizId: currentQuizId,
            quizTitle: getCurrentQuiz().title,
            timestamp: Date.now(),
            total: questions.length,
            score: 0,
            percentage: 0,
            answers: []
        };

        questions.forEach((q, index) => {
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            const inputs = document.querySelectorAll(`input[name="q${index}"]:checked`);
            
            let userAnswers = [];
            inputs.forEach(input => userAnswers.push(parseInt(input.value)));
            userAnswers.sort();

            // Compare arrays
            let isCorrect = false;
            if (userAnswers.length === q.answer.length && 
                userAnswers.every((value, i) => value === q.answer[i])) {
                isCorrect = true;
                score++;
            }

            if (isCorrect) {
                feedbackDiv.className = 'feedback correct';
                feedbackDiv.innerHTML = `<strong>✓ Correct</strong><div class="explanation">${q.explanation}</div>`;
            } else {
                feedbackDiv.className = 'feedback incorrect';
                let correctText = q.answer.map(i => q.options[i]).join(', ');
                feedbackDiv.innerHTML = `<strong>✗ Incorrect</strong><br>Correct Answer: <span class="highlight">${correctText}</span><div class="explanation">${q.explanation}</div>`;
            }

            // Hide feedback after grading and enable per-question toggle
            feedbackDiv.style.display = 'none';
            const toggleBtn = document.getElementById(`show-answer-${index}`);
            toggleBtn.disabled = false;
            toggleBtn.textContent = 'Show Answer';

            attempt.answers.push({
                questionId: q.id,
                question: q.question,
                isCorrect,
                userAnswers,
                correctAnswers: q.answer,
                userAnswerText: userAnswers.map(i => q.options[i]).filter(Boolean),
                correctAnswerText: q.answer.map(i => q.options[i])
            });
        });

        hasSubmitted = true;
        attempt.score = score;
        attempt.percentage = Math.round((score / attempt.total) * 100);

        const resultDisplay = document.getElementById('result-display');
        resultDisplay.style.display = 'block';
        let gradeColor = attempt.percentage >= 50 ? 'green' : 'red';
        
        resultDisplay.innerHTML = `
            You scored ${attempt.score} / ${attempt.total}<br>
            <span style="color:${gradeColor}; font-size:0.8em">${attempt.percentage}% - ${attempt.percentage >= 50 ? 'PASS' : 'FAIL'}</span>
        `;
        
        recordAttempt(attempt);
        resultDisplay.scrollIntoView({behavior: "smooth"});
    }

    function toggleAnswer(index) {
        if (!hasSubmitted) return;
        const feedbackDiv = document.getElementById(`feedback-${index}`);
        const btn = document.getElementById(`show-answer-${index}`);
        const isVisible = feedbackDiv.style.display === 'block';
        feedbackDiv.style.display = isVisible ? 'none' : 'block';
        btn.textContent = isVisible ? 'Show Answer' : 'Hide Answer';
    }

    function formatDate(ts) {
        const d = new Date(ts);
        return `${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}`;
    }

        const panel = document.getElementById('analytics');
        const history = historyCache.filter(h => h.quizId === currentQuizId);

        if (!history.length) {

            return;
        }
        const attempts = history.length;
        const avg = Math.round(history.reduce((sum, h) => sum + h.percentage, 0) / attempts);
        const best = Math.max(...history.map(h => h.percentage));
        const last = history[history.length - 1];
        panel.innerHTML += `
            <div>Attempts: <strong>${attempts}</strong></div>
            <div>Average score: <strong>${avg}%</strong></div>
            <div>Best score: <strong>${best}%</strong></div>
            <div>Last attempt: <strong>${last.score}/${last.total} (${last.percentage}%)</strong> on ${formatDate(last.timestamp)}</div>
        `;
    }

    function renderHistory() {
        const panel = document.getElementById('history');
        const history = historyCache.filter(h => h.quizId === currentQuizId);
        panel.innerHTML = '<h3>Recent Attempts</h3>';
        if (!history.length) {
            panel.innerHTML += '<div>No attempts stored yet.</div>';
            return;
        }
        const recent = history.slice(-5).reverse();
        panel.innerHTML += recent.map(h => `
            <div class="history-item">
                <strong>${formatDate(h.timestamp)}</strong> — ${h.score}/${h.total} (${h.percentage}%)
            </div>
        `).join('');
        panel.innerHTML += '<div style="font-size:0.85em; color:#7f8c8d;">History kept for 30 days. Oldest data is removed first if storage is full.</div>';
    }

    function renderWrongAnswers() {
        const panel = document.getElementById('wrong-answers');
        const history = historyCache.filter(h => h.quizId === currentQuizId);
        panel.innerHTML = '<h3>Review Past Wrong Answers (latest attempt)</h3>';
        if (!history.length) {
            panel.innerHTML += '<div>No attempts yet to review.</div>';
            return;
        }
        const latest = history[history.length - 1];
        const wrong = latest.answers.filter(a => !a.isCorrect);
        if (!wrong.length) {
            panel.innerHTML += `<div>Great job! No wrong answers on your last attempt (${formatDate(latest.timestamp)}).</div>`;
            return;
        }
        panel.innerHTML += `<div>From ${formatDate(latest.timestamp)}:</div>`;
        panel.innerHTML += wrong.map(item => `
            <div class="wrong-answer">
                <div><strong>${item.question}</strong></div>
                <div>Your answer: ${item.userAnswerText.length ? item.userAnswerText.join(', ') : 'No selection'}</div>
                <div>Correct answer: ${item.correctAnswerText.join(', ')}</div>
            </div>
        `).join('');
    }

    function pruneHistory(history) {
        const cutoff = Date.now() - MAX_AGE_MS;
        return history.filter(entry => entry.timestamp >= cutoff);
    }

    function loadHistory() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
            return [];
        }
    }

    function persistHistory(history) {
        let copy = [...history];
        while (true) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
                return copy;
            } catch (e) {
                if (!copy.length) {
                    console.warn('Unable to save history: storage full.');
                    return [];
                }
                // Remove oldest and retry
                copy.shift();
            }
        }
    }

    function recordAttempt(attempt) {
        historyCache.push(attempt);
        historyCache = pruneHistory(historyCache);
        historyCache = persistHistory(historyCache);
        renderAnalytics();
        renderHistory();
        renderWrongAnswers();
    }

    function switchMock(id) {
        if (!quizLibrary[id]) return;
        currentQuizId = id;
        buildQuiz();
        renderAnalytics();
        renderHistory();
        renderWrongAnswers();
    }

    // Initialize
    historyCache = pruneHistory(loadHistory());
    historyCache = persistHistory(historyCache);
    populateMockSelector();
    buildQuiz();
    renderAnalytics();
    renderHistory();
    renderWrongAnswers();
</script>

</body>
</html>
